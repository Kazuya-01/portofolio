<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — M. Syarifudin</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0e17;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,71,87,0.06) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      pointer-events: none;
    }
    .container { position: relative; z-index: 1; max-width: 480px; }
    .code {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff4757, #ffc048);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }
    .kanji {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.2rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; color: #fff; }
    p { color: #94a3b8; line-height: 1.7; margin-bottom: 32px; font-size: 0.95rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg, #ff4757, #ffc048);
      color: #0a0e17;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,71,87,0.3); }
    .dots { margin-top: 32px; display: flex; gap: 8px; justify-content: center; }
    .dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff4757; animation: dotPulse 1.5s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.3s; }
    .dots span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="code">404</div>
    <div class="kanji">エラー — Error</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Sepertinya kamu tersesat〜 halaman yang kamu cari tidak ada atau sudah dipindahkan.</p>
    <a href="/" class="btn"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
